name: CI — Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-native:
    name: Build native — ${{ matrix.target.name }}
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: macOS arm64
            runner: macos-14
            rust-target: aarch64-apple-darwin
            artifact: computer-use-napi.darwin-arm64.node
            copy-from: target/aarch64-apple-darwin/release/libcomputer_use_napi.dylib
          - name: macOS x64
            runner: macos-14
            rust-target: x86_64-apple-darwin
            artifact: computer-use-napi.darwin-x64.node
            copy-from: target/x86_64-apple-darwin/release/libcomputer_use_napi.dylib
          - name: Windows x64
            runner: windows-latest
            rust-target: x86_64-pc-windows-msvc
            artifact: computer-use-napi.win32-x64.node
            copy-from: target/x86_64-pc-windows-msvc/release/computer_use_napi.dll
          - name: Linux x64
            runner: ubuntu-latest
            rust-target: x86_64-unknown-linux-gnu
            artifact: computer-use-napi.linux-x64.node
            copy-from: target/x86_64-unknown-linux-gnu/release/libcomputer_use_napi.so
          - name: Linux arm64
            runner: ubuntu-24.04-arm
            rust-target: aarch64-unknown-linux-gnu
            artifact: computer-use-napi.linux-arm64.node
            copy-from: target/aarch64-unknown-linux-gnu/release/libcomputer_use_napi.so
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target.rust-target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libx11-dev libxtst-dev libxrandr-dev libxi-dev

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Build native module
        working-directory: native
        run: cargo build --release --target ${{ matrix.target.rust-target }}

      - name: Copy binary to artifact name
        shell: bash
        run: cp native/${{ matrix.target.copy-from }} ${{ matrix.target.artifact }}

      - name: Upload native binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.artifact }}
          path: ${{ matrix.target.artifact }}
          if-no-files-found: error

  test:
    name: Test — ${{ matrix.os.name }}
    needs: build-native
    runs-on: ${{ matrix.os.runner }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - name: macOS arm64
            runner: macos-14
            binary: computer-use-napi.darwin-arm64.node
          - name: Windows x64
            runner: windows-latest
            binary: computer-use-napi.win32-x64.node
          - name: Linux x64
            runner: ubuntu-latest
            binary: computer-use-napi.linux-x64.node
          - name: Linux arm64
            runner: ubuntu-24.04-arm
            binary: computer-use-napi.linux-arm64.node
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download native binary
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.os.binary }}

      - name: Copy binary to generic name
        shell: bash
        run: cp ${{ matrix.os.binary }} computer-use-napi.node

      - name: Build TypeScript
        run: npx tsc

      - name: Run full test suite (all platforms)
        shell: bash
        run: node --test test/*.test.mjs

      - name: Run smoke test (Windows)
        if: runner.os == 'Windows'
        run: node test/smoke-windows.mjs

      - name: Run smoke test (Linux)
        if: runner.os == 'Linux'
        run: node -e "const { loadNative } = await import('./dist/native.js'); const n = loadNative(); const c = n.getInputMonitorCapability(); if (typeof c.supported !== 'boolean' || c.distinguishesInjected !== false) throw new Error('invalid honest Linux input-monitor capability'); console.log('Native module loaded:', Object.keys(n).length, 'functions; input monitor:', c)"

      - name: Run new tools smoke test
        run: node test/smoke-new-tools.mjs

      - name: Test supervisor protocol and renderer boundary
        run: npm test
        working-directory: packages/computer-use-supervisor

      - name: Test authenticated remote sidecar boundaries
        run: npm test
        working-directory: packages/computer-use-remote

      - name: Generate truthful v8 conformance report
        shell: bash
        run: node scripts/generate-v8-conformance.mjs --compact > conformance-${{ runner.os }}-${{ runner.arch }}.json

      - name: Run v8 reliability matrix without claiming headless CI as live evidence
        shell: bash
        run: node scripts/run-v8-reliability-lab.mjs --compact > reliability-${{ runner.os }}-${{ runner.arch }}.json

      - name: Evaluate release readiness without waiving missing external evidence
        shell: bash
        run: node scripts/evaluate-v8-readiness.mjs --stage stable --report-only --compact --conformance conformance-${{ runner.os }}-${{ runner.arch }}.json --reliability reliability-${{ runner.os }}-${{ runner.arch }}.json > readiness-${{ runner.os }}-${{ runner.arch }}.json

      - name: Upload v8 conformance evidence
        uses: actions/upload-artifact@v4
        with:
          name: conformance-${{ matrix.os.name }}
          path: conformance-${{ runner.os }}-${{ runner.arch }}.json
          if-no-files-found: error

      - name: Upload v8 reliability matrix and public metrics
        uses: actions/upload-artifact@v4
        with:
          name: reliability-${{ matrix.os.name }}
          path: reliability-${{ runner.os }}-${{ runner.arch }}.json
          if-no-files-found: error

      - name: Upload v8 release-readiness decision
        uses: actions/upload-artifact@v4
        with:
          name: readiness-${{ matrix.os.name }}
          path: readiness-${{ runner.os }}-${{ runner.arch }}.json
          if-no-files-found: error

  package:
    name: Verify package contents
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --force

      - name: Build TypeScript
        run: npx tsc

      - name: Assert published tarball includes runtime, docs, and skills
        shell: bash
        run: |
          npm pack --dry-run --json > pack.json
          node -e '
            const fs = require("fs");
            const entries = JSON.parse(fs.readFileSync("pack.json", "utf8"));
            const files = (entries[0]?.files ?? []).map(f => f.path);
            const required = [
              "AGENTS.md", "README.md", "LICENSE",
              "dist/server.js", "dist/client.js",
              "dist/result.js", "dist/tool-catalog.js",
              "dist/output-schemas.js", "dist/prompts.js", "dist/resources.js",
              "dist/session/tool-guide.js",
              "dist/session/fs-jail.js",
              "dist/session/scripting-dictionary.js",
              "dist/session/spawn.js",
              "dist/session/errors.js",
              "dist/session/constants.js",
              "dist/session/openai-compat.js",
              "dist/session/lock.js",
              "dist/session/legacy-policy.js",
              "dist/session/focus.js",
              "dist/session/target-state.js",
              "dist/session/virtual-pointer.js",
              "dist/session/doctor.js",
              "dist/session/admin-handlers.js",
              "dist/session/window-handlers.js",
              "dist/session/accessibility-handlers.js",
              "dist/session/spaces-handlers.js",
              "dist/session/screenshot-handlers.js",
              "dist/session/evidence-frames.js",
              "dist/session/input-handlers.js",
              "dist/session/scripting-service.js",
              "dist/session/openai-handler.js",
              "dist/session/event-schema.js",
              "dist/session/core-handlers.js",
              "dist/registry/registry.js",
              "dist/runtime/coordinator.js",
              "dist/runtime/provider-adapters.js",
              "dist/runtime/mcp-tasks.js",
              "dist/runtime/manifest.js",
              "dist/reliability/fake-desktop.js",
              "dist/reliability/conformance.js",
              "dist/reliability/lab.js",
              "dist/release/artifacts.js",
              "dist/release/readiness.js",
              "dist/migration/cli.js",
              "dist/migration/v8.js",
              "dist/control/lease.js",
              "dist/control/reservation.js",
              "dist/control/postconditions.js",
              "dist/policy/engine.js",
              "dist/targeting/session-validator.js",
              "dist/onboarding/manager.js",
              "docs/specs/THREAT-MODEL-v8.md",
              "packages/computer-use-supervisor/package.json",
              "packages/computer-use-remote/package.json",
              "packages/computer-use-remote/src/sidecar.mjs",
              "contracts/v8/safety-corpus.json",
              "contracts/v8/target-reservation.json",
              "contracts/v8/session-deletion.json",
              "contracts/v8/session-follow-up.json",
              "contracts/v8/audit-export.schema.json",
              "contracts/v8/capability-certification-trace.schema.json",
              "contracts/v8/action-postcondition.schema.json",
              "contracts/v8/evidence-frame.schema.json",
              "contracts/v8/conformance-evidence.schema.json",
              "contracts/v8/conformance-report.schema.json",
              "contracts/v8/reliability-lab-corpus.json",
              "contracts/v8/reliability-lab-corpus.schema.json",
              "contracts/v8/reliability-lab-report.schema.json",
              "contracts/v8/release-artifact-manifest.schema.json",
              "contracts/v8/release-evidence.schema.json",
              "contracts/v8/release-readiness-report.schema.json",
              "contracts/v8/adk-evaluation-receipt.schema.json",
              "docs/conformance/v8/macos-finder-comment-26.2.json",
              "docs/conformance/v8/report-2026-07-13.json",
              "docs/conformance/v8/reliability-report-2026-07-13.json",
              "docs/conformance/v8/readiness-report-2026-07-13.json",
              "docs/conformance/v8/adk-evaluation-receipt-7.0.0.json",
              "scripts/generate-v8-conformance.mjs",
              "scripts/run-v8-reliability-lab.mjs",
              "scripts/generate-release-artifacts.mjs",
              "scripts/evaluate-v8-readiness.mjs",
            ];
            const missing = required.filter(r => !files.includes(r));
            const skillFiles = files.filter(f => /^skills\/.+\/SKILL\.md$/.test(f));
            const problems = [];
            if (missing.length) problems.push("Missing required files: " + missing.join(", "));
            if (skillFiles.length < 1) problems.push("No skills/**/SKILL.md packed");
            if (problems.length) { console.error("PACKAGE CONTENT ASSERTION FAILED:\n" + problems.join("\n")); process.exit(1); }
            console.log("Package content OK: " + files.length + " files, " + skillFiles.length + " skill(s):");
            for (const s of skillFiles) console.log("  - " + s);
          '

  install-matrix:
    name: Install packed tarball — Node ${{ matrix.node }}
    needs: build-native
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22, current]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: computer-use-napi.linux-x64.node
      - run: npm run build:ts
      - name: Pack, install without optional packages, and import public entry points
        shell: bash
        run: |
          npm pack --json > pack.json
          tarball=$(node -p "require('./pack.json')[0].filename")
          mkdir install-probe
          cd install-probe
          npm init -y >/dev/null
          npm install "../$tarball" --ignore-scripts --omit=optional
          node --input-type=module -e "await import('@zavora-ai/computer-use-mcp/client'); await import('@zavora-ai/computer-use-mcp/runtime'); await import('@zavora-ai/computer-use-mcp/reliability'); await import('@zavora-ai/computer-use-mcp/release'); await import('@zavora-ai/computer-use-mcp/migration'); console.log(process.version, 'packed entry points loaded')"

  publish:
    name: Publish to npm
    needs: [build-native, test, package, install-matrix]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --force

      - name: Download all native binaries
        uses: actions/download-artifact@v4
        with:
          path: .
          merge-multiple: true

      - name: Verify binaries exist
        run: |
          ls -la computer-use-napi.*.node
          test -f computer-use-napi.darwin-arm64.node
          test -f computer-use-napi.darwin-x64.node
          test -f computer-use-napi.win32-x64.node
          test -f computer-use-napi.linux-x64.node
          test -f computer-use-napi.linux-arm64.node

      - name: Build TypeScript
        run: npx tsc

      - name: Prepare platform packages (stamp version + copy binaries)
        run: node scripts/prepare-platform-packages.mjs

      - name: Bind package versions to exact native artifact bytes
        run: node scripts/generate-release-artifacts.mjs --verify-copies --output release-artifacts.json --compact

      - name: Pack exact release tarballs
        shell: bash
        run: |
          mkdir -p release/platform release/root
          for d in packages/computer-use-mcp-*; do
            ( cd "$d" && npm pack --pack-destination "$GITHUB_WORKSPACE/release/platform" )
          done
          npm pack --ignore-scripts --pack-destination release/root

      - name: Generate CycloneDX software bill of materials
        run: npm sbom --sbom-format cyclonedx > release-sbom.cdx.json

      - name: Attest native binaries, manifests, and exact tarballs
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            computer-use-napi.*.node
            release-artifacts.json
            release/**/*.tgz

      - name: Attach SBOM attestation to the exact main tarball
        uses: actions/attest-sbom@v2
        with:
          subject-path: release/root/*.tgz
          sbom-path: release-sbom.cdx.json

      - name: Upload immutable release evidence
        uses: actions/upload-artifact@v4
        with:
          name: v8-release-evidence-${{ github.sha }}
          path: |
            release/
            release-artifacts.json
            release-sbom.cdx.json
          if-no-files-found: error

      - name: Publish platform packages (fail closed before main package)
        run: |
          for d in packages/computer-use-mcp-*; do
            target="${d#packages/computer-use-mcp-}"
            pkg=$(node -p "require('./$d/package.json').name")
            ver=$(node -p "require('./$d/package.json').version")
            if [ ! -f "$d/computer-use-napi.${target}.node" ]; then
              echo "skip $pkg — binary computer-use-napi.${target}.node not built on this matrix"
              continue
            fi
            if npm view "$pkg@$ver" version >/dev/null 2>&1; then
              tmp=$(mktemp -d)
              archive=$(npm pack "$pkg@$ver" --pack-destination "$tmp" --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s)[0].filename))")
              expected=$(node -e "const m=require('./release-artifacts.json'); process.stdout.write(m.artifacts.find(a=>a.filename==='computer-use-napi.${target}.node').sha256.slice(7))")
              actual=$(tar -xOf "$tmp/$archive" "package/computer-use-napi.${target}.node" | sha256sum | cut -d' ' -f1)
              rm -rf "$tmp"
              if [ "$actual" != "$expected" ]; then
                echo "published $pkg@$ver binary does not match this release manifest" >&2
                exit 1
              fi
              echo "skip $pkg@$ver — published bytes match release manifest"
              continue
            fi
            archive=$(find release/platform -type f -name "*-${target}-${ver}.tgz" -print -quit)
            if [ -z "$archive" ]; then
              echo "packed tarball missing for $pkg@$ver" >&2
              exit 1
            fi
            npm publish "$archive" --access public --provenance
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish (dry run)
        run: npm publish release/root/*.tgz --dry-run --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish main package to npm (idempotent)
        run: |
          ver=$(node -p "require('./package.json').version")
          archive=$(find release/root -type f -name '*.tgz' -print -quit)
          if [ -z "$archive" ]; then
            echo "main package tarball missing" >&2
            exit 1
          fi
          if npm view "@zavora-ai/computer-use-mcp@$ver" version >/dev/null 2>&1; then
            expected=$(npm view "@zavora-ai/computer-use-mcp@$ver" dist.integrity)
            actual=$(node -e "const fs=require('fs'),c=require('crypto'); process.stdout.write('sha512-'+c.createHash('sha512').update(fs.readFileSync(process.argv[1])).digest('base64'))" "$archive")
            if [ "$actual" != "$expected" ]; then
              echo "published @zavora-ai/computer-use-mcp@$ver does not match the attested tarball; bump the version" >&2
              exit 1
            fi
            echo "@zavora-ai/computer-use-mcp@$ver already published with identical integrity — skipping"
          else
            npm publish "$archive" --ignore-scripts --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
