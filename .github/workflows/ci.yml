name: CI — Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # 7.7.0: a push to main never cancels the run before it, which may be staging packages (npm publication is not
  # atomic across seven packages); pull request runs still cancel their predecessors.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build-native:
    name: Build native — ${{ matrix.target.name }}
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: macOS arm64
            runner: macos-14
            rust-target: aarch64-apple-darwin
            artifact: computer-use-napi.darwin-arm64.node
            copy-from: target/aarch64-apple-darwin/release/libcomputer_use_napi.dylib
          - name: macOS x64
            runner: macos-14
            rust-target: x86_64-apple-darwin
            artifact: computer-use-napi.darwin-x64.node
            copy-from: target/x86_64-apple-darwin/release/libcomputer_use_napi.dylib
          - name: Windows x64
            runner: windows-latest
            rust-target: x86_64-pc-windows-msvc
            artifact: computer-use-napi.win32-x64.node
            copy-from: target/x86_64-pc-windows-msvc/release/computer_use_napi.dll
          - name: Windows arm64
            runner: windows-11-arm
            rust-target: aarch64-pc-windows-msvc
            artifact: computer-use-napi.win32-arm64.node
            copy-from: target/aarch64-pc-windows-msvc/release/computer_use_napi.dll
          - name: Linux x64
            runner: ubuntu-latest
            rust-target: x86_64-unknown-linux-gnu
            artifact: computer-use-napi.linux-x64.node
            copy-from: target/x86_64-unknown-linux-gnu/release/libcomputer_use_napi.so
          - name: Linux arm64
            runner: ubuntu-24.04-arm
            rust-target: aarch64-unknown-linux-gnu
            artifact: computer-use-napi.linux-arm64.node
            copy-from: target/aarch64-unknown-linux-gnu/release/libcomputer_use_napi.so
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target.rust-target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libx11-dev libxtst-dev libxrandr-dev libxi-dev

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Build native module
        working-directory: native
        run: cargo build --release --target ${{ matrix.target.rust-target }}

      - name: Copy binary to artifact name
        shell: bash
        run: cp native/${{ matrix.target.copy-from }} ${{ matrix.target.artifact }}

      - name: Upload native binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.artifact }}
          path: ${{ matrix.target.artifact }}
          if-no-files-found: error

  platform-packages:
    name: Pack all six native platform packages
    needs: build-native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: computer-use-napi.*.node
          merge-multiple: true
      - name: Synchronize versions, require every artifact, and verify tarball contents
        run: npm run pack:platforms
      - uses: actions/upload-artifact@v4
        with:
          name: native-platform-packages
          path: release/platform/
          if-no-files-found: error

  lint:
    name: Lint TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Type-aware rules need declaration output, and the lint config is
      # platform-independent, so this runs once rather than across the matrix.
      - name: Build TypeScript
        run: npx tsc

      - name: ESLint
        run: npm run lint

  native-checks:
    name: Native tests & lint — ${{ matrix.host.name }}
    runs-on: ${{ matrix.host.runner }}
    strategy:
      fail-fast: false
      matrix:
        host:
          # One runner per OS so the cfg-gated platform code is type-checked and
          # its unit tests actually execute. Cross-compiled targets in
          # build-native are compile-checked only and cannot run tests.
          - name: macOS arm64
            runner: macos-14
          - name: Windows x64
            runner: windows-latest
          - name: Linux x64
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libx11-dev libxtst-dev libxrandr-dev libxi-dev

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Run Rust unit tests
        working-directory: native
        run: cargo test --release

      # Not `-D warnings`: the FFI declaration blocks raise several hundred
      # unavoidable warnings. These two groups are the ones that catch real
      # defects, and they are clean today.
      - name: Clippy (correctness and suspicious lints are errors)
        working-directory: native
        run: cargo clippy --release --all-targets -- -D clippy::correctness -D clippy::suspicious

  test:
    name: Test — ${{ matrix.os.name }}
    needs: [build-native, platform-packages]
    runs-on: ${{ matrix.os.runner }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - name: macOS arm64
            runner: macos-14
            binary: computer-use-napi.darwin-arm64.node
          - name: Windows x64
            runner: windows-latest
            binary: computer-use-napi.win32-x64.node
          - name: Windows arm64
            runner: windows-11-arm
            binary: computer-use-napi.win32-arm64.node
          - name: Linux x64
            runner: ubuntu-latest
            binary: computer-use-napi.linux-x64.node
          - name: Linux arm64
            runner: ubuntu-24.04-arm
            binary: computer-use-napi.linux-arm64.node
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download native binary
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.os.binary }}

      - name: Copy binary to generic name
        shell: bash
        run: cp ${{ matrix.os.binary }} computer-use-napi.node

      - name: Build TypeScript through the package script (proves build:ts works on every OS)
        run: npm run build:ts

      - name: Verify the current source build addon loads
        run: node scripts/verify-local-native.mjs
        env:
          COMPUTER_USE_NATIVE_PATH: ${{ github.workspace }}/${{ matrix.os.binary }}

      - name: Run full test suite (all platforms)
        shell: bash
        run: node --test test/*.test.mjs
        env:
          COMPUTER_USE_NATIVE_PATH: ${{ github.workspace }}/${{ matrix.os.binary }}

      - name: Download packed native packages
        uses: actions/download-artifact@v4
        with:
          name: native-platform-packages
          path: release/platform

      - name: Verify automatic optional package installation and native loading
        run: node test/platform-install.mjs

      - name: Run smoke test (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          node scripts/verify-local-native.mjs
          node test/smoke-windows.mjs
        env:
          COMPUTER_USE_NATIVE_PATH: ${{ github.workspace }}/${{ matrix.os.binary }}

      - name: Run smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          node scripts/verify-local-native.mjs
          node -e "const { loadNative } = await import('./dist/native.js'); const n = loadNative(); const c = n.getInputMonitorCapability(); if (typeof c.supported !== 'boolean' || c.distinguishesInjected !== false) throw new Error('invalid honest Linux input-monitor capability'); console.log('Native module loaded:', Object.keys(n).length, 'functions; input monitor:', c)"
        env:
          COMPUTER_USE_NATIVE_PATH: ${{ github.workspace }}/${{ matrix.os.binary }}

      # 7.6.1: the input smoke used to "pass" on Linux with no X server because the native layer returned silently;
      # coordinate validation now asks the display for its size, so the clicks need a display. Xvfb gives them a real one.
      - name: Install a virtual display and the X11 tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb xdotool wmctrl xclip > /dev/null

      - name: Run new tools smoke test (Linux, under Xvfb)
        if: runner.os == 'Linux'
        run: |
          node scripts/verify-local-native.mjs
          xvfb-run -a --server-args="-screen 0 1280x800x24" node test/smoke-new-tools.mjs
        env:
          COMPUTER_USE_NATIVE_PATH: ${{ github.workspace }}/${{ matrix.os.binary }}

      - name: Run new tools smoke test
        if: runner.os != 'Linux'
        shell: bash
        run: |
          node scripts/verify-local-native.mjs
          node test/smoke-new-tools.mjs
        env:
          COMPUTER_USE_NATIVE_PATH: ${{ github.workspace }}/${{ matrix.os.binary }}

  # 7.7.x: the live Linux check on real (headless) desktops. The unit tests run under Xvfb with no window manager, so
  # activation, window geometry and the window-manager hints were never exercised. Xfce's and Openbox's window managers
  # cover the X11 flavours (Xubuntu, Lubuntu and the others run X11); sway's headless backend covers wlroots, where it
  # has no input devices, so its input checks are skipped. libei input is tested by the native unit tests against a
  # test EIS server (linux_ei::live::tests), which need no desktop.
  linux-desktops:
    name: Linux desktop — ${{ matrix.desktop }}
    needs: build-native
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        desktop: [xfwm4, openbox, sway]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download native binary
        uses: actions/download-artifact@v4
        with:
          name: computer-use-napi.linux-x64.node

      - name: Copy binary to generic name
        run: cp computer-use-napi.linux-x64.node computer-use-napi.node

      - name: Build TypeScript
        run: npm run build:ts

      - name: Install the desktop and the tools the server drives
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dbus-daemon x11-utils xdotool wmctrl xclip imagemagick zenity > /dev/null
          case "${{ matrix.desktop }}" in
            sway) sudo apt-get install -y -qq sway grim > /dev/null ;;
            *) sudo apt-get install -y -qq xvfb ${{ matrix.desktop }} > /dev/null ;;
          esac

      - name: Live check on ${{ matrix.desktop }} (headless)
        run: bash scripts/ci-linux-desktop.sh ${{ matrix.desktop }}
        env:
          COMPUTER_USE_NATIVE_PATH: ${{ github.workspace }}/computer-use-napi.linux-x64.node

  package:
    name: Verify package contents
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --force

      - name: Build TypeScript
        run: npx tsc

      - name: Assert published tarball includes runtime, docs, and skills
        shell: bash
        run: |
          npm pack --dry-run --json > pack.json
          node -e '
            const fs = require("fs");
            const entries = JSON.parse(fs.readFileSync("pack.json", "utf8"));
            const files = (entries[0]?.files ?? []).map(f => f.path);
            const required = [
              "AGENTS.md", "README.md", "SECURITY.md", "LICENSE",
              "mcp-server.toml", "docs/ARCHITECTURE.md", "docs/releases/v7.2.0.md", "docs/assets/astra-painting.png",
              "dist/server.js", "dist/client.js", "dist/efficiency.js", "dist/efficiency.d.ts", "docs/EFFICIENCY.md",
              "dist/desktop-broker.js", "dist/strategy.js", "dist/session-console.js",
              "dist/browser.js", "dist/runtime.js", "dist/runtime-worker.js",
              "dist/task-store.js", "dist/authority.js", "dist/approval-ledger.js",
              "dist/supervisor.js", "dist/supervisor-worker.js", "dist/task-client.js",
              "dist/isolated-worker.js", "dist/evaluation.js", "libexec/linux-atspi.py", "docs/STRATEGY.md",
              "dist/result.js", "dist/tool-catalog.js",
              "dist/output-schemas.js", "dist/prompts.js", "dist/resources.js",
              "dist/http.js", "dist/mcp-v7.1.js", "dist/mcp-tasks.js", "dist/resource-links.js",
              "dist/session/application-discovery.js", "dist/session/application-discovery.d.ts",
              "dist/session/tool-guide.js",
              "dist/session/fs-jail.js",
              "dist/session/scripting-dictionary.js",
              "dist/session/spawn.js",
              "dist/session/errors.js",
              "dist/session/constants.js",
              "dist/session/openai-compat.js",
              "dist/session/lock.js",
              "dist/session/legacy-policy.js",
              "dist/session/focus.js",
              "dist/session/target-state.js",
              "dist/session/virtual-pointer.js",
              "dist/session/doctor.js",
              "dist/session/admin-handlers.js",
              "dist/session/window-handlers.js",
              "dist/session/accessibility-handlers.js",
              "dist/session/spaces-handlers.js",
              "dist/session/screenshot-handlers.js",
              // v7.5 agent desktop and v7.6 surface
              "dist/launch.js", "dist/env.js", "dist/instructions.js", "dist/entrypoint.js",
              "dist/session/agent-desktop-handlers.js", "dist/session/macos-helper.js", "dist/session/pid-delivery.js",
              "dist/session/user-activity.js", "dist/session/window-select.js", "dist/session/keys.js", "dist/session/input-handlers.js",
              "libexec/macos-agent-helper.swift", "docs/releases/v7.5.0.md", "docs/releases/v7.6.0.md", "docs/releases/v7.6.1.md", "docs/releases/v7.7.0.md",
              "dist/session/input-handlers.js",
              "dist/session/scripting-service.js",
              "dist/session/openai-handler.js",
              "dist/session/core-handlers.js",
              "dist/registry/registry.js",
            ];
            const missing = required.filter(r => !files.includes(r));
            const skillFiles = files.filter(f => /^skills\/.+\/SKILL\.md$/.test(f));
            const problems = [];
            if (missing.length) problems.push("Missing required files: " + missing.join(", "));
            if (skillFiles.length < 1) problems.push("No skills/**/SKILL.md packed");
            if (problems.length) { console.error("PACKAGE CONTENT ASSERTION FAILED:\n" + problems.join("\n")); process.exit(1); }
            console.log("Package content OK: " + files.length + " files, " + skillFiles.length + " skill(s):");
            for (const s of skillFiles) console.log("  - " + s);
          '

  install-matrix:
    name: Install packed tarball — Node ${{ matrix.node }}
    needs: build-native
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24, current]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: computer-use-napi.linux-x64.node
      - run: npm run build:ts
      - name: Pack, install without optional packages, and import public entry points
        shell: bash
        run: |
          npm pack --json > pack.json
          tarball=$(node -p "require('./pack.json')[0].filename")
          mkdir install-probe
          cd install-probe
          npm init -y >/dev/null
          npm install "../$tarball" --ignore-scripts --omit=optional
          node --input-type=module -e "await import('@zavora-ai/computer-use-mcp'); await import('@zavora-ai/computer-use-mcp/client'); await import('@zavora-ai/computer-use-mcp/efficiency'); await import('@zavora-ai/computer-use-mcp/desktop-broker'); await import('@zavora-ai/computer-use-mcp/browser'); await import('@zavora-ai/computer-use-mcp/runtime'); await import('@zavora-ai/computer-use-mcp/task-store'); await import('@zavora-ai/computer-use-mcp/server'); await import('@zavora-ai/computer-use-mcp/http'); await import('@zavora-ai/computer-use-mcp/tool-catalog'); await import('@zavora-ai/computer-use-mcp/registry'); await import('@zavora-ai/computer-use-mcp/host-native'); console.log(process.version, 'packed entry points loaded')"

  publish:
    name: Stage npm release for approval
    needs: [build-native, platform-packages, lint, native-checks, test, package, install-matrix]
    runs-on: ubuntu-latest
    if: github.repository == 'zavora-ai/computer-use-mcp' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci --ignore-scripts --force

      - name: Download all native binaries
        uses: actions/download-artifact@v4
        with:
          path: .
          pattern: computer-use-napi.*.node
          merge-multiple: true

      - name: Download exact tested platform tarballs
        uses: actions/download-artifact@v4
        with:
          name: native-platform-packages
          path: release/platform

      - name: Verify binaries exist
        run: |
          ls -la computer-use-napi.*.node
          test -f computer-use-napi.darwin-arm64.node
          test -f computer-use-napi.darwin-x64.node
          test -f computer-use-napi.win32-x64.node
          test -f computer-use-napi.win32-arm64.node
          test -f computer-use-napi.linux-x64.node
          test -f computer-use-napi.linux-arm64.node

      - name: Build TypeScript
        run: npx tsc

      - name: Pack exact universal release tarball
        shell: bash
        run: |
          mkdir -p release/root
          npm pack --ignore-scripts --pack-destination release/root

      - name: Verify universal tarball contains every native target
        shell: bash
        run: |
          archive=$(find release/root -type f -name '*.tgz' -print -quit)
          if [ -z "$archive" ]; then
            echo "universal release tarball missing" >&2
            exit 1
          fi
          tar -tzf "$archive" > release/root/contents.txt
          for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64 win32-arm64 win32-x64; do
            grep -Fxq "package/computer-use-napi.${target}.node" release/root/contents.txt
          done
          tar -xOzf "$archive" package/package.json | node -e '
            let source = "";
            process.stdin.on("data", chunk => source += chunk);
            process.stdin.on("end", () => {
              const manifest = JSON.parse(source);
              for (const target of ["darwin-arm64", "darwin-x64", "linux-arm64", "linux-x64", "win32-arm64", "win32-x64"]) {
                if (manifest.optionalDependencies?.[`@zavora-ai/computer-use-mcp-${target}`] !== manifest.version) {
                  throw new Error(`optional native package ${target} must match the main version`);
                }
              }
              console.log("universal tarball contains all six native targets");
            });
          '

      - name: Generate CycloneDX software bill of materials
        run: npm sbom --sbom-format cyclonedx > release-sbom.cdx.json

      - name: Attest native binaries and exact tarballs
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            computer-use-napi.*.node
            release/root/*.tgz
            release/platform/*.tgz

      - name: Attach SBOM attestation to the exact main tarball
        uses: actions/attest-sbom@v2
        with:
          subject-path: release/root/*.tgz
          sbom-path: release-sbom.cdx.json

      - name: Upload immutable release evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-${{ github.sha }}
          path: |
            release/
            release-sbom.cdx.json
          if-no-files-found: error

      # New npm names need a maintainer session or stage-only token once, before
      # trusted publishing can be configured. OIDC handles subsequent releases.
      - name: Stage all native packages with provenance for maintainer approval
        run: node scripts/stage-platform-packages.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_NATIVE_STAGE_TOKEN }}

      - name: Stage main package for maintainer approval
        run: |
          ver=$(node -p "require('./package.json').version")
          archive=$(find release/root -type f -name '*.tgz' -print -quit)
          if [ -z "$archive" ]; then
            echo "main package tarball missing" >&2
            exit 1
          fi
          if npm view "@zavora-ai/computer-use-mcp@$ver" version >/dev/null 2>&1; then
            expected=$(npm view "@zavora-ai/computer-use-mcp@$ver" dist.integrity)
            actual=$(node -e "const fs=require('fs'),c=require('crypto'); process.stdout.write('sha512-'+c.createHash('sha512').update(fs.readFileSync(process.argv[1])).digest('base64'))" "$archive")
            if [ "$actual" != "$expected" ]; then
              # A docs or CI change after the release changes the tarball but not the version. That is not a reason to
              # fail main: nothing is published, and the next version bump stages a fresh release.
              echo "::warning::@zavora-ai/computer-use-mcp@$ver is already published and the tarball differs from this build; nothing staged. Bump the version to publish again."
              exit 0
            fi
            echo "@zavora-ai/computer-use-mcp@$ver already published with identical integrity — skipping"
          else
            set +e
            output=$(npm stage publish "$archive" --access public --provenance 2>&1)
            status=$?
            set -e
            printf '%s\n' "$output"
            if [ "$status" -ne 0 ] && printf '%s' "$output" | grep -q 'E409' && printf '%s' "$output" | grep -qiE 'already staged|Cannot stage previously published version'; then
              # 7.6.1 behaviour, restored in 7.7.0: a version staged and awaiting approval is not an error. Staging again
              # cannot replace it; the maintainer compares the pending tarball with this run's release evidence.
              echo "::warning::@zavora-ai/computer-use-mcp@$ver is already staged and awaiting approval; nothing staged again."
              exit 0
            fi
            if [ "$status" -ne 0 ]; then
              commit=${GITHUB_SHA:-$(git rev-parse HEAD 2>/dev/null || printf unavailable)}
              integrity=$(node -e "const fs=require('fs'),c=require('crypto'); process.stdout.write('sha512-'+c.createHash('sha512').update(fs.readFileSync(process.argv[1])).digest('base64'))" "$archive")
              echo "::error::Cannot stage @zavora-ai/computer-use-mcp@$ver; commit=$commit artifact=$archive integrity=$integrity evidence=release-evidence-$commit. Verify any pending tarball before approval."
              exit "$status"
            fi
          fi
        env:
          NODE_AUTH_TOKEN: ''
          NPM_CONFIG_USERCONFIG: /dev/null
