<text x="80" y="621" class="heading">macOS / Windows / Linux — applications, displays, accessibility services and filesystem</text>
<text x="80" y="645" class="small">Backend support varies by operating system; the Linux helper is an execution adapter, not an operating system.</text>
<rect x="30" y="715" width="1540" height="174" rx="12" class="panel"/>
