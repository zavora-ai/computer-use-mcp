<text x="1070" y="827" class="body">Roots • elicitation • updates • logging</text>
<rect x="30" y="915" width="1540" height="825" rx="12" class="panel"/>
<text x="55" y="953" class="section">3   Optional host integrations — implemented in source, unreleased</text>
<text x="55" y="980" class="small">Each row is a separate relationship. Repeated core components identify where that integration connects.</text>
