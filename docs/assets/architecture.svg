<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1900" viewBox="0 0 1600 1900" role="img" aria-labelledby="title desc">
<title id="title">Computer-use MCP: current source architecture</title>
<desc id="desc">Core tool dispatch and four execution adapters, protocol services, and separate flows for optional desktop sessions, browser automation, persistence, human takeover, Docker JavaScript execution and isolated Linux desktops. Arrows show the labeled call or control direction. Replies return along the call path.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#3c6685"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#193950}.title{font-size:34px;font-weight:700}.section{font-size:21px;font-weight:700}.heading{font-size:19px;font-weight:700}.body{font-size:16px}.small{font-size:14px;fill:#4a677c}.edge{fill:none;stroke:#3c6685;stroke-width:2;marker-end:url(#arrow)}.card{fill:#edf5fd;stroke:#a7c5de;stroke-width:1.4}.opt{fill:#eaf8f4;stroke:#a0ccc0;stroke-width:1.4}.panel{fill:white;stroke:#d5e1ea;stroke-width:1.3}</style>
