<text x="80" y="1617" class="body">Separate deployment from host desktop</text>
<rect x="600" y="1560" width="400" height="90" rx="12" class="opt"/>
<text x="620" y="1590" class="heading">Docker Linux desktop</text>
<text x="620" y="1617" class="body">Xvfb • Openbox • D-Bus • AT-SPI</text>
<rect x="1140" y="1560" width="400" height="90" rx="12" class="opt"/>
<text x="1160" y="1590" class="heading">Worker MCP server</text>
<text x="1160" y="1617" class="body">Own session / native / Linux backends</text>
<path d="M460 1605H600" class="edge"/>
<text x="472" y="1590" class="small">start</text>
<path d="M1000 1605H1140" class="edge"/>
<text x="1012" y="1590" class="small">MCP stdio</text>
<text x="60" y="1688" class="body">Desktop console: desktop_console returns session state; an optional MCP App renders it with a text fallback.</text>
<text x="60" y="1715" class="small">Runtime and isolated desktop containers default to no network. Reset / resume authority remains with the trusted host.</text>
<text x="50" y="1780" class="body">Authority: filesystem access = operator roots ∩ negotiated client roots. Remote identity is verified by the embedding host.</text>
<text x="50" y="1810" class="small">Scope: runtime component overview, not every module or deployment topology. Optional integration does not imply platform validation.</text>
<text x="50" y="1838" class="small">Sources: server.ts • registry/registry.ts • session.ts • strategy.ts • browser-tools.ts • docs/STRATEGY.md</text>
<text x="50" y="1866" class="small">See docs/ARCHITECTURE.md for protocol details and docs/STRATEGY.md for service behavior and release gates.</text>
</svg>
