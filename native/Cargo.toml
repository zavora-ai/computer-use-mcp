[package]
name = "computer-use-napi"
version = "1.0.0"
edition = "2021"
authors = ["James Karanja Maina <james@zavora.ai>"]
description = "Rust NAPI native module for computer-use-mcp"
license = "MIT"

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(cargo_clippy)'] }

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", features = ["napi9", "serde-json"] }
napi-derive = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = { version = "0.24", features = ["highsierra", "elcapitan"] }
foreign-types = "0.5"
core-graphics-types = "0.2"
core-foundation = "0.10"
objc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
x11 = { version = "2.21", features = ["xlib", "xtest", "xrandr", "xinput"] }
libc = "0.2"
# Wayland input through the RemoteDesktop portal and libei: a pure Rust protocol implementation, no C library.
reis = "0.7.1"
zbus = "5"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Variant",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    # 7.7.0: visible window bounds and cloaking (W4, K6)
    "Win32_Graphics_Dwm",
    # 7.7.0: PrintWindow (the windows crate files it under XPS)
    "Win32_Storage_Xps",
    # 7.7.0: Windows.Graphics.Capture for windows PrintWindow cannot draw (K6)
    "Foundation",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    # 7.7.0: locked screen, disconnected session and display-awake (K5)
    "Win32_System_RemoteDesktop",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Power",
] }

[build-dependencies]
napi-build = "2"

[profile.release]
opt-level = 2
strip = "symbols"
